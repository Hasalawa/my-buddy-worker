name: my_buddy_worker_mobile_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.7
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/logo_lightMode.png
    - assets/images/logo_man.png
    - assets/images/gear.png
    - assets/images/round_dark.png
    - assets/images/round_light.png

fonts:
    - family: Boldonse
      fonts:
        - asset: assets/fonts/Boldonse.ttf
        
flutter_native_splash:
  color: "#F9FAFB" 
  color_dark: "#0A0A0A"
  image: "assets/images/logo_lightMode.png"
  image_dark: "assets/images/logo.png"
  
  android_12:
    color: "#F9FAFB"
    color_dark: "#0A0A0A"
    image: "assets/images/logo_lightMode.png"
    image_dark: "assets/images/logo.png"

  fullscreen: true